name: Build & Release Android App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Etiqueta de la versión (ej. v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compiler Studio - Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure .env exists for Secrets Gradle Plugin
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Keystore & Signing Credentials
        run: |
          # Si existen secrets en el repositorio de GitHub se usan prioritariamente:
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using custom release keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          elif [ -f debug.keystore.base64 ]; then
            echo "Using default project keystore base64..."
            base64 -d debug.keystore.base64 > my-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          else
            echo "Generating self-signed release keystore..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=CompilerStudio, OU=Dev, O=App, L=City, ST=State, C=US"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Release App Bundle (AAB)
        run: ./gradlew bundleRelease --no-daemon

      - name: Prepare Release Artifacts (Compiler Studio)
        run: |
          mkdir -p release-output
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" release-output/CompilerStudio.apk
            echo "Copied APK to release-output/CompilerStudio.apk"
          fi
          AAB_FILE=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$AAB_FILE" ]; then
            cp "$AAB_FILE" release-output/CompilerStudio.aab
            echo "Copied AAB to release-output/CompilerStudio.aab"
          fi

      - name: Determine Release Tag
        id: release-tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v1.0.${{ github.run_number }}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Publish Direct to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag_name }}
          name: "Compiler Studio ${{ steps.release-tag.outputs.tag_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 📱 Compiler Studio ${{ steps.release-tag.outputs.tag_name }}
            
            Compilador nativo de scripts CLEO (.csa / .csi) para GTA San Andreas Android.
            
            ### ⬇️ Descargas directas:
            - **CompilerStudio.apk**: Archivo APK listo para instalar en cualquier dispositivo Android.
            - **CompilerStudio.aab**: Android App Bundle oficial para distribución o Google Play.
          files: |
            release-output/CompilerStudio.apk
            release-output/CompilerStudio.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
